<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bd: #8884; --muted: #888; --accent: #2563eb; }
  body { width: 420px; margin: 0; font: 13px system-ui, sans-serif; }
  header { padding: 10px 14px; font-weight: 600; border-bottom: 1px solid var(--bd); }
  #empty { padding: 24px 14px; color: var(--muted); text-align: center; }
  .item { padding: 10px 14px; border-bottom: 1px solid var(--bd); }
  .name { font-weight: 500; word-break: break-all; }
  .meta { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--accent); color: #fff; font-size: 11px; margin-right: 6px; }
  button { font: inherit; padding: 4px 10px; margin-right: 6px; border: 1px solid var(--bd); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hint { color: var(--muted); font-size: 11px; padding: 8px 14px; }
</style>
</head>
<body>
  <header>Médias détectés sur cet onglet</header>
  <div id="perm" hidden>
    Pour détecter les médias, l'extension doit pouvoir observer les requêtes réseau des sites.
    <div><button class="primary" id="grant">Autoriser l'accès aux sites</button></div>
    <div class="hint" style="padding:6px 0 0">Recharge ensuite la page de la vidéo.</div>
  </div>
  <div id="empty">Aucun média détecté.<br>Lance la lecture de la vidéo puis rouvre ce panneau.</div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
